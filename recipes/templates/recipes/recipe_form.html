{% extends "base.html" %}

{% block content %}
<style>
    .form-container { max-width: 700px; margin: 40px auto; background: #FFF; padding: 40px; border: 1px solid var(--border-color); border-radius: 8px; }
    .form-container h1 { text-align: center; margin-bottom: 30px; color: var(--bg-dark); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
    .form-control { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; font-family: 'Inter', sans-serif; }
    .errorlist { color: red; font-size: 0.9rem; margin-top: 5px; list-style: none; padding: 0; }
    .btn-submit { background-color: var(--accent); color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
    .btn-submit:hover { background-color: #E67E22; }
</style>

<div class="form-container">
    <h1>{{ title }}</h1>
    <!-- Обязательно enctype для файлов и csrf_token для безопасности -->
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endfor %}
        
        <button type="submit" class="btn-submit">Сохранить</button>
    </form>
</div>
{% endblock %}
