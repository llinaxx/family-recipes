{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Family Recipes{% endblock %}</title>
    <!-- Подключаем Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Подключаем наши кастомные стили -->
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <!-- Шапка сайта (подключается из includes/navigation.html) -->
    {% include "includes/navigation.html" %}

    <!-- Основной контент страниц -->
    <main class="container mt-4 mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал сайта -->
    <footer class="text-center py-4">
        <p class="mb-0">© <span id="current-year"></span> Семейная кулинарная книга. Все права защищены.</p>
    </footer>

    <!-- Скрипт для автоматического года -->
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
