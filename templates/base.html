<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Семейные рецепты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #F5EFE6; 
            --bg-dark: #3E2723;  
            --text-dark: #3E2723; 
            --text-cream: #F5EFE6; 
            --accent: #D35400;   
            --border-color: #D7CCC8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; }
        .container { max-width: 1140px; margin: 0 auto; padding: 0 20px; width: 100%; }
        
        .navbar-custom { background-color: var(--bg-dark); padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .navbar-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .navbar-brand { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; color: var(--text-cream) !important; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; }
        .nav-links { display: flex; gap: 30px; }
        
        .nav-link { 
            color: var(--text-cream) !important; 
            font-family: 'Inter', sans-serif; 
            font-weight: 400; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-decoration: none; 
            transition: color 0.3s; 
            position: relative;
            padding-bottom: 5px;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--accent);
            transition: width 0.3s;
        }
        .nav-link:hover { color: var(--accent) !important; }
        .nav-link:hover::after { width: 100%; }

        .main-content { flex: 1; }
        
        footer { background-color: var(--bg-dark); color: var(--text-cream); padding: 40px 0; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
        footer p { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin: 0; }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <div class="container navbar-inner">
            <a class="navbar-brand" href="{% url 'welcome' %}">Семейные рецепты</a>
            <div class="nav-links">
                <a class="nav-link" href="{% url 'welcome' %}">Главная</a>
                <a class="nav-link" href="{% url 'recipe_list' %}">Меню</a>
                <a class="nav-link" href="{% url 'recipe_search' %}">Поиск</a>
                <a class="nav-link" href="{% url 'statistics' %}">Статистика</a>
            </div>
        </div>
    </nav>
    
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
    
    <footer>
        <div class="container">
            <p>&copy; 2026 Семейная кулинарная книга</p>
        </div>
    </footer>
</body>
</html>
